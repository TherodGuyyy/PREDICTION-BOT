name: WNBA Tips Bot

on:
  schedule:
    # Runs at 14:00 UTC daily (adjust if you want a different time —
    # this is roughly midday US time, after most WNBA schedules for
    # the day are confirmed). Lagos (WAT) is UTC+1 year-round, so
    # 14:00 UTC = 15:00 in Lagos.
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab, for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
