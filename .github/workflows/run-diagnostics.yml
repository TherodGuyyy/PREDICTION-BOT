name: Run Diagnostics (mobile-friendly test)
 
on:
  workflow_dispatch: {}
 
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      # Catches an import-chain break BEFORE it can slip through to a live
      # scheduled run — e.g. the real 2026-09-30 incident where
      # tennis_analysis.py was updated to import passes_accuracy_bar from
      # analysis.py, but an older analysis.py without that function got left
      # behind in the repo. Every individual diagnostic step below tests one
      # file's own __main__ block in isolation, which does NOT exercise
      # main.py's full import chain — only an actual `import main` does.
      # No API keys needed here: importing a module never calls run(), so
      # this is a pure syntax/dependency check, nothing more.
      - name: Smoke test — main.py imports cleanly
        run: python -c "import main; print('main.py and its full import chain are OK')"
 
      - name: Run WNBA odds diagnostics
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
        run: python odds_fetcher.py
        continue-on-error: true
 
      - name: Run tennis odds diagnostics
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
        run: python tennis_odds_fetcher.py
        continue-on-error: true
 
      # read-only here — this workflow doesn't commit, so any matches
      # found during this run won't be saved; this just shows current
      # archive health (total matches, distinct players, and any
      # "couldn't determine a winner" diagnostic dumps)
      - name: Run tennis archiver diagnostics
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
        run: python tennis_archiver.py
        continue-on-error: true
 
      - name: Run ACB stats diagnostics
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: python acb_stats_fetcher.py
        continue-on-error: true
 
      - name: Run tennis stats diagnostics
        run: python tennis_stats_fetcher.py
        continue-on-error: true
 
      - name: Run NCAAB stats diagnostics
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
        run: python ncaab_stats_fetcher.py
        continue-on-error: true
 
      - name: Run NCAAB odds diagnostics
        env:
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
        run: python ncaab_odds_fetcher.py
        continue-on-error: true
 
